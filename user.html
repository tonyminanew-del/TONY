<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المستخدم</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            color: #333;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }
        .title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            margin: 0 0 10px 0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: right;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #27ae60;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="title" id="formTitle">تسجيل دخول المستخدم</p>
        
        <form id="userForm">
            <!-- خانة رقم الهاتف -->
            <div class="input-group">
                <label for="userPhone">رقم الهاتف:</label>
                <input type="tel" id="userPhone" required placeholder="اكتب رقم هاتفك...">
            </div>

            <!-- خانة الاسم تظهر فقط لو رقم الهاتف غير مسجل (أول مرة فقط) -->
            <div id="nameFieldContainer" class="hidden input-group" style="margin-top: 15px;">
                <label for="userName">الاسم الكامل:</label>
                <input type="text" id="userName" placeholder="اكتب اسمك الذي سيظهر في الترحيب...">
            </div>

            <button type="submit" id="submitBtn" style="margin-top: 20px;">دخول</button>
        </form>
    </div>

    <!-- استدعاء مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("userForm");
            const phoneInput = document.getElementById("userPhone");
            const nameInput = document.getElementById("userName");
            const nameContainer = document.getElementById("nameFieldContainer");
            const submitBtn = document.getElementById("submitBtn");
            const formTitle = document.getElementById("formTitle");

            let isNewUserStep = false;

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                const phone = phoneInput.value.trim();

                try {
                    if (!isNewUserStep) {
                        // الخطوة 1: البحث برقم الهاتف في قاعدة البيانات
                        const existingUser = await db.collection("users")
                            .where("phone", "==", phone)
                            .get();

                        if (!existingUser.empty) {
                            // لو الرقم موجود، يدخل فوراً لصفحة tony.html بالـ ID ويجيب اسمه القديم تلقائياً
                            const userId = existingUser.docs[0].id;
                            window.location.href = `tony.html?id=${userId}`;
                        } else {
                            // لو الرقم مش موجود، يظهر خانة الاسم عشان يسجله لأول مرة فقط
                            formTitle.textContent = "تسجيل بيانات جديدة";
                            nameContainer.classList.remove("hidden");
                            nameInput.setAttribute("required", "true");
                            submitBtn.textContent = "حفظ ودخول";
                            isNewUserStep = true;
                        }
                    } else {
                        // الخطوة 2: لو مستخدم جديد، يحفظ الاسم ورقم الهاتف في فايربيس
                        const name = nameInput.value.trim();
                        if (name !== "") {
                            const docRef = await db.collection("users").add({
                                name: name,
                                phone: phone,
                                createdAt: new Date()
                            });
                            // يدخل لصفحة tony.html ويعرض اسمه الجديد
                            window.location.href = `user/tony.html?id=${docRef.id}`;
                        } else {
                            alert("يرجى كتابة الاسم بشكل صحيح!");
                        }
                    }
                } catch (error) {
                    console.error("خطأ في الاتصال بقاعدة البيانات: ", error);
                    alert("حدث خطأ في الاتصال، حاول مرة أخرى.");
                }
            });
        });
    </script>
</body>
</html>
