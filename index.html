<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ملعب كنيسة الشهيد العظيم مارجرجس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>اهلا ببرنامج ملعب كنيسة الشهيد العظيم مارجرجس</h2>
        
        <form id="loginForm">
            <input type="text" id="userInput" placeholder="أدخل الاسم " required>
            <button type="submit">دخول</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // منع إعادة تحميل الصفحة الافتراضي
            event.preventDefault();

            // جلب القيمة المدخلة مع إزالة المسافات الزائدة
            const inputVal = document.getElementById('userInput').value.trim();

            // التحقق من كلمة السر أو الاسم والتوجيه حسب المطلوب
            if (inputVal === 'TONY@CONTROL2026') {
                window.location.href = 'admin/sign.html'; // أو 'sign.html' حسب مكان الملف عندك
            } else {
                window.location.href = 'user.html';
            }
        });
    </script>

</body>
</html>
