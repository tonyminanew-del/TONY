<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية للمستخدم</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            font-size: 14px;
            color: #495057;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-box span {
            font-weight: bold;
            color: #2980b9;
        }
        .clock-box {
            font-size: 15px;
            font-weight: bold;
            color: #e67e22;
            background: #fdf3e7;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #f5cba7;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .btn-booking {
            background-color: #27ae60;
        }
        .btn-booking:hover {
            background-color: #219653;
        }
        .btn-result {
            background-color: #e67e22;
        }
        .btn-result:hover {
            background-color: #d35400;
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2980b9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- المكان الذي سيظهر فيه الاسم الحقيقي -->
        <h2 id="welcomeUser">جاري تحميل الاسم...</h2>

        <!-- الساعة والدقيقة والثانية والتاريخ -->
        <div class="clock-box" id="liveClock">جاري تحديث الوقت...</div>

        <div class="info-box">
            <div>📅 <strong>تاريخ اليوم:</strong> <span id="currentDateText">جاري الحساب...</span></div>
            <div>⚽ <strong>حجزك القادم:</strong> <span id="nextBookingText">جاري البحث عن حجز...</span></div>
        </div>

        <div class="btn-group">
            <button type="button" id="profileBtn">الملف الشخصي (Profile)</button>
            <button type="button" id="bookingBtn" class="btn-booking">احجز الملعب</button>
            <button type="button" id="resultBtn" class="btn-result">متابعة حالة الحجز</button>
        </div>
    </div>

    <!-- استدعاء مكتبات فايربيس المتوافقة -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        let db = null;
        let currentUserId = null;

        // تهيئة Firebase
        function initializeFirebase() {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                return true;
            } catch (error) {
                console.error("خطأ في تهيئة Firebase:", error);
                showError("خطأ في الاتصال بقاعدة البيانات");
                return false;
            }
        }

        // عرض رسالة خطأ
        function showError(message) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.textContent = message;
            errorDiv.style.display = "block";
            setTimeout(() => {
                errorDiv.style.display = "none";
            }, 5000);
        }

        // عرض رسالة نجاح
        function showSuccess(message) {
            const successDiv = document.getElementById("successMessage");
            successDiv.textContent = message;
            successDiv.style.display = "block";
            setTimeout(() => {
                successDiv.style.display = "none";
            }, 3000);
        }

        // تحديث الساعة بشكل حي
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            const clockElement = document.getElementById("liveClock");
            if (clockElement) {
                clockElement.textContent = `⏰ الوقت: ${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
        }

        // بدء تحديث الساعة
        setInterval(updateClock, 1000);
        updateClock();

        // تحميل البيانات عند فتح الصفحة
        document.addEventListener("DOMContentLoaded", async () => {
            // تهيئة Firebase أولاً
            if (!initializeFirebase()) {
                return;
            }

            const welcomeElement = document.getElementById("welcomeUser");
            const currentDateText = document.getElementById("currentDateText");
            const nextBookingText = document.getElementById("nextBookingText");

            // تعيين التاريخ
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayFormatted = new Date().toLocaleDateString('ar-EG', options);
            if (currentDateText) currentDateText.textContent = todayFormatted;

            // الحصول على ID من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            currentUserId = urlParams.get("id");

            try {
                let userData = null;

                // 1. محاولة جلب المستخدم عبر الـ id في الرابط
                if (currentUserId) {
                    try {
                        const userDoc = await db.collection("users").doc(currentUserId).get();
                        if (userDoc.exists) {
                            userData = userDoc.data();
                        }
                    } catch (fetchError) {
                        console.warn("لم يتم العثور على المستخدم بـ ID:", currentUserId);
                    }
                }

                // 2. إذا لم يوجد id أو لم يتم العثور عليه، نجلب أحدث مستخدم مسجل
                if (!userData) {
                    try {
                        const snapshot = await db.collection("users").limit(1).get();
                        if (!snapshot.empty) {
                            currentUserId = snapshot.docs[0].id;
                            userData = snapshot.docs[0].data();
                        }
                    } catch (fetchError) {
                        console.warn("لم يتم العثور على أي مستخدمين");
                    }
                }

                // 3. عرض الترحيب
                if (userData) {
                    const realName = userData.name || userData.fullName || userData.userName || userData.username || userData.adminName || userData.firstName;
                    
                    if (realName) {
                        welcomeElement.textContent = `أهلاً يا ${realName}`;
                    } else {
                        welcomeElement.textContent = `أهلاً بك`;
                    }
                } else {
                    welcomeElement.textContent = "أهلاً يا صديقي";
                }

                // 4. جلب الحجز الخاص بالمستخدم
                if (currentUserId) {
                    try {
                        const bookingSnapshot = await db.collection("bookings")
                            .where("userId", "==", currentUserId)
                            .get();

                        if (!bookingSnapshot.empty) {
                            let bookings = [];
                            bookingSnapshot.forEach(doc => { bookings.push(doc.data()); });
                            const bookingData = bookings[bookings.length - 1]; // أحدث حجز

                            const bDate = bookingData.date || "غير محدد";
                            const bTime = bookingData.time || "غير محدد";
                            const bStatus = bookingData.status || "قيد الانتظار";
                            
                            nextBookingText.innerHTML = `${bDate} (${bTime}) - <span style="color: ${bStatus === 'مقبول' ? '#27ae60' : '#e67e22'}">${bStatus}</span>`;
                        } else {
                            nextBookingText.textContent = "لا يوجد حجوزات مسجلة";
                        }
                    } catch (bookingError) {
                        console.warn("خطأ في جلب الحجوزات:", bookingError);
                        nextBookingText.textContent = "تعذر جلب الحجوزات";
                    }
                }

            } catch (error) {
                console.error("خطأ عام:", error);
                welcomeElement.textContent = "أهلاً بك";
                nextBookingText.textContent = "تعذر جلب البيانات";
                showError("حدث خطأ في تحميل البيانات");
            }

            // تفعيل الأزرار
            const profileBtn = document.getElementById("profileBtn");
            const bookingBtn = document.getElementById("bookingBtn");
            const resultBtn = document.getElementById("resultBtn");

            profileBtn.addEventListener("click", () => {
                if (currentUserId) {
                    window.location.href = `profile.html?id=${currentUserId}`;
                } else {
                    window.location.href = "profile.html";
                }
            });

            bookingBtn.addEventListener("click", () => {
                if (currentUserId) {
                    window.location.href = `حجز .html?id=${currentUserId}`;
                } else {
                    window.location.href = "حجز .html";
                }
            });

            resultBtn.addEventListener("click", () => {
                if (currentUserId) {
                    window.location.href = `result.html?id=${currentUserId}`;
                } else {
                    window.location.href = "result.html";
                }
            });
        });
    </script>
</body>
</html>
